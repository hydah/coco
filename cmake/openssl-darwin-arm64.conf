## -*- mode: perl; -*-
## OpenSSL 1.1.1g predates Apple Silicon; this is the darwin64-arm64-cc
## target as added upstream in 1.1.1i.

my %targets = (
    "darwin64-arm64-cc" => {
        inherit_from     => [ "darwin-common", asm("aarch64_asm") ],
        CFLAGS           => add("-Wall"),
        cflags           => add("-arch arm64"),
        lib_cppflags     => add("-DL_ENDIAN"),
        bn_ops           => "SIXTY_FOUR_BIT_LONG",
        perlasm_scheme   => "ios64",
    },
);
